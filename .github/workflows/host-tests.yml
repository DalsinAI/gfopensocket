name: host tests

# What runs without the NDK (which is not redistributed): the card layer's
# configuration parser (guest/network/acnet/tests/host), the vector table
# generated from the ABI manifest, and the build scripts' syntax. The m68k
# builds and bsdqual run on an AmiCradle lab.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: card layer configuration parser
        working-directory: guest/network/acnet/tests/host
        run: |
          gcc -Wall -Wextra -Werror -Wno-unused-parameter -Iinclude -I../../library \
            -o card_parse_test card_parse_test.c ../../library/card_parse.c
          ./card_parse_test
      - name: sendmsg/recvmsg iovecs (lib_msgvec.h)
        working-directory: guest/network/acnet/tests/host
        run: |
          gcc -Wall -Wextra -Werror -I../../library -o msgvec_test msgvec_test.c
          ./msgvec_test
      - name: Direct's IP_TTL and multicast, with lwIP
        working-directory: guest/network/acnet/tests/host
        run: |
          L=../../direct/lwip/src
          LWIP="$L/core/def.c $L/core/dns.c $L/core/inet_chksum.c $L/core/init.c $L/core/ip.c $L/core/mem.c
            $L/core/memp.c $L/core/netif.c $L/core/pbuf.c $L/core/raw.c $L/core/tcp.c $L/core/tcp_in.c
            $L/core/tcp_out.c $L/core/timeouts.c $L/core/udp.c $L/core/ipv4/dhcp.c $L/core/ipv4/etharp.c
            $L/core/ipv4/icmp.c $L/core/ipv4/igmp.c $L/core/ipv4/ip4.c $L/core/ipv4/ip4_addr.c $L/core/ipv4/ip4_frag.c
            $L/netif/ethernet.c"
          I="-Iinclude -Idirect_arch -I../../direct/port -I$L/include -I../../direct -I../../library -I../../../../common/protocol -I../../../acnetwork/include"
          for t in direct_ttl_test direct_igmp_test; do
            gcc -Wall -Werror -Wno-unused-parameter $I -o $t $t.c ../../direct/direct_sock.c $LWIP
            ./$t
          done
          # and Direct built without multicast (DIRECT_CFLAGS=-DDIRECT_IGMP=0)
          gcc -Wall -Werror -Wno-unused-parameter -DDIRECT_IGMP=0 $I -o direct_ttl_test0 direct_ttl_test.c ../../direct/direct_sock.c $LWIP
          ./direct_ttl_test0
      - name: vector table from the ABI manifest
        run: |
          L=guest/network/acnet/library
          LIB="$L/lib_base.c $L/lib_fd.c $L/lib_errno.c $L/lib_tags.c $L/lib_strings.c $L/lib_select.c $L/lib_conn.c $L/lib_io.c $L/lib_opt.c $L/lib_names.c $L/lib_inet.c guest/network/acnet/compat/roadshow/routes.c guest/network/acnet/compat/roadshow/state.c guest/network/acnet/compat/roadshow/modern.c guest/network/acnet/compat/roadshow/bpf.c"
          python3 $L/gen_vectors.py guest/network/acnet/abi/bsdsocket-v4.json /tmp/vectors.c $LIB \
            --guard guest/network/acnet/compat/roadshow/guard-v4.json | tee /tmp/vectors.log
          grep -q '46 implemented, 0 stubs' /tmp/vectors.log
      - name: build scripts parse
        run: for f in $(git ls-files '*.sh'); do sh -n "$f" || exit 1; done
